<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabby</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <header>
      <div class="brand"><span>t</span><strong>tabby</strong></div>
      <div class="privacy">● Stored on this device</div>
    </header>
    <main>
      <section class="hero">
        <p class="eyebrow">CURRENT WINDOW</p>
        <h1>Make room to focus.</h1>
        <p>Select tabs to keep safely, then close only the ones you choose.</p>
      </section>
      <section class="panel" aria-labelledby="tabs-title">
        <div class="panel-head">
          <div><h2 id="tabs-title">Open tabs</h2><span id="count">Loading…</span></div>
          <label><input type="checkbox" id="select-all" /> Select capturable</label>
        </div>
        <div id="tabs" aria-live="polite"></div>
        <div class="actions">
          <span id="status" role="status">Reading this window…</span>
          <button id="save" class="secondary" disabled>Save</button>
          <button id="save-close" disabled>Save &amp; close</button>
        </div>
      </section>
      <section class="saved panel" aria-labelledby="saved-title">
        <div class="panel-head"><div><h2 id="saved-title">Saved recently</h2><span>Your local capture history</span></div></div>
        <div id="saved"></div>
      </section>
    </main>
    <div id="toast" class="toast" hidden><span id="toast-copy"></span><button id="undo">Undo</button></div>
    <script type="module" src="newtab.js"></script>
  </body>
</html>
